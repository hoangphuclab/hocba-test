<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test nhận diện giấy</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
</head>
<body>
  <main class="app">
    <header><h1>Test nhận diện giấy</h1><span id="modelStatus" class="status">Đang tải model…</span></header>

    <section class="panel">
      <div class="actions">
        <label class="button" for="fileInput">Chọn ảnh</label>
        <input id="fileInput" type="file" accept="image/*" hidden>
        <button id="cameraButton" type="button">Mở camera</button>
        <button id="captureButton" type="button" disabled>Chụp ảnh</button>
      </div>
      <video id="video" autoplay playsinline hidden></video>
      <canvas id="previewCanvas" hidden></canvas>
      <div id="placeholder" class="placeholder">Chọn ảnh hoặc mở camera</div>
      <div class="previewWrap"><img id="preview" alt="Ảnh kiểm tra" hidden></div>
      <div class="actions bottomActions">
        <button id="runButton" class="primary" type="button" disabled>Nhận diện</button>
        <button id="stopCameraButton" type="button" disabled>Đóng camera</button>
      </div>
    </section>

    <section id="resultPanel" class="panel result" hidden>
      <div class="resultLabel">Kết quả</div>
      <h2 id="resultName">—</h2>
      <div class="metrics">
        <div><span>Thời gian suy luận</span><strong id="inferenceTime">—</strong></div>
        <div><span>Tải model</span><strong id="loadTime">—</strong></div>
      </div>
      <p id="resultNote" class="note"></p>
    </section>
    <p id="error" class="error" hidden></p>
    <footer></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
